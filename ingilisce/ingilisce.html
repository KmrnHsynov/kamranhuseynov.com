<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12357a">
  <title>İngiliscə Öyrən</title>
  <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css?v=2">
  <link rel="stylesheet" href="ingilisce.css?v=2">
</head>
<body>

  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/">İngiliscə Öyrən</a>
    <nav class="nav" aria-label="Əsas">
      <a href="#/" data-nav="course">Kurs</a>
      <a href="#/tekrar" data-nav="review">Təkrar</a>
      <a href="#/soz" data-nav="vocab">Söz oyunu</a>
    </nav>
    <div class="account">
      <button class="account-btn" id="accountBtn" aria-expanded="false" aria-controls="accountMenu">
        <span class="initial" id="accountInitial" aria-hidden="true"></span>
        <span class="account-name" id="accountName"></span>
      </button>
      <div class="account-menu" id="accountMenu" hidden>
        <strong id="menuName"></strong>
        <p class="muted" id="menuProgress"></p>
        <button class="btn danger small" id="signOutBtn">Çıxış et</button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading muted">Yüklənir…</p>
  </main>

  <template id="authTemplate">
    <div class="auth">
      <section class="auth-intro">
        <p class="auth-brand">İngiliscə Öyrən</p>
        <h1>İngilis qrammatikası, Azərbaycan dilində</h1>
        <p>Mövzuları sıra ilə oxuyun, dinləyin və hər birini qısa sualla yoxlayın.</p>
      </section>
      <section class="auth-form">
        <div class="tabs" role="group" aria-label="Hesab">
          <button type="button" data-tab="signup" aria-pressed="true">Yeni hesab</button>
          <button type="button" data-tab="signin" aria-pressed="false">Daxil ol</button>
        </div>

        <form id="signupForm" novalidate>
          <label class="field"><span>Adınız</span>
            <input type="text" id="signupName" maxlength="24" autocomplete="username" required></label>
          <label class="field"><span>Şifrə</span>
            <input type="password" id="signupPassword" autocomplete="new-password" aria-describedby="pwdRules" required>
            <small id="pwdRules">Ən azı 8 simvol, bir böyük hərf və bir xüsusi simvol.</small></label>
          <label class="field"><span>Şifrəni təkrar yazın</span>
            <input type="password" id="signupConfirm" autocomplete="new-password" required></label>
          <label class="check"><input type="checkbox" class="show-pwd"> Şifrəni göstər</label>
          <p class="error-text" role="alert" hidden></p>
          <button class="btn">Hesab yarat</button>
        </form>

        <form id="signinForm" novalidate hidden>
          <label class="field"><span>Adınız</span>
            <input type="text" id="signinName" autocomplete="username" required></label>
          <label class="field"><span>Şifrə</span>
            <input type="password" id="signinPassword" autocomplete="current-password" required></label>
          <label class="check"><input type="checkbox" class="show-pwd"> Şifrəni göstər</label>
          <p class="error-text" role="alert" hidden></p>
          <button class="btn">Daxil ol</button>
        </form>
      </section>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"
          integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="content.js?v=2"></script>
  <script src="ui.js?v=2"></script>
  <script src="ingilisce.js?v=2"></script>
</body>
</html>
